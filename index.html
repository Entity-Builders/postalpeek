<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PostalPeek — The World, Reimagined</title>
    <meta
      name="description"
      content="Explore anywhere. AI-generated watercolor postcards from streets around the globe. A digital wanderer's sketchbook."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PostalPeek" />
    <meta property="og:title" content="PostalPeek — The World, Reimagined" />
    <meta property="og:description" content="AI-generated watercolor postcards from streets around the globe. A digital wanderer's sketchbook." />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:url" content="__OG_URL__" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PostalPeek — The World, Reimagined" />
    <meta name="twitter:description" content="AI-generated watercolor postcards from streets around the globe." />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <link rel="preconnect" href="https://img.postalpeek.app" crossorigin>
    <link rel="dns-prefetch" href="https://img.postalpeek.app">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@1,400;1,600&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #e6e2da;">
    <!-- Landscape orientation guard — shown via CSS @media (orientation:landscape) -->
    <div id="landscape-block" style="
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #e6e2da;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: 'Outfit', sans-serif;
    ">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5c5347" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Phone rotate icon -->
        <rect x="5" y="2" width="14" height="20" rx="2"/>
        <path d="M12 18h.01"/>
        <path d="M9 2L15 2" stroke-width="1"/>
      </svg>
      <p style="margin:0; color:#5c5347; font-size:16px; font-weight:500; text-align:center; padding: 0 32px;">
        Rotate to portrait mode
      </p>
      <p style="margin:0; color:#9b8f83; font-size:13px; text-align:center; padding: 0 32px;">
        PostalPeek works best in portrait 📮
      </p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      async
      src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_MAPS_API_KEY%&libraries=places"
    ></script>
  </body>
</html>
